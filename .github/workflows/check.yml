name: check

on:
  push:
    branches: [master, main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  is-trusted:
    name: is-trusted
    # 信頼できるソースからのトリガかを判定します。
    # セルフホステッドランナの利用を制御するために使用します。
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Log trust conditions and decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPO_FULL_NAME: ${{ github.repository }}
          IS_PUSH: ${{ github.event_name == 'push' }}
          IS_MERGE_GROUP: ${{ github.event_name == 'merge_group' }}
          IS_INTERNAL: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          echo "is-trusted: evaluating trust conditions"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.event.pull_request.head.repo.full_name=${PR_HEAD_REPO_FULL_NAME}"
          echo "github.repository=${REPO_FULL_NAME}"
          echo "condition push=${IS_PUSH}"
          echo "condition merge_group=${IS_MERGE_GROUP}"
          echo "condition internal=${IS_INTERNAL}"
          trusted="false"
          if [ "${IS_PUSH}" = "true" ] || \
            [ "${IS_MERGE_GROUP}" = "true" ] || \
            [ "${IS_INTERNAL}" = "true" ]; then
            trusted="true"
          fi
          echo "trusted=${trusted}"

          if [ "${trusted}" = "true" ]; then
            echo "Trusted source confirmed"
            exit 0
          fi

          echo "Untrusted source: self-hosted runner jobs will not run"
          exit 1

  nix-fast-build:
    name: nix-fast-build
    # セルフホステッドランナで確かめるものを、1回の`nix-fast-build`でまとめて処理します。
    # チェック、全ホストとhome-managerの構成のビルド、ホストのブートテストです。
    #
    # 以前はこれらを別々のジョブに分けていましたが、
    # ジョブごとに同じホストの構成を評価し直すことになり、
    # 評価の重複が実行時間の大半を占めていました。
    # 何を処理するかはflakeの`ciJobs`に書いています。
    needs: is-trusted
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # `ncaq/nix-composite-action`内のniks3-publicとのOIDC認証に使用
    # セルフホステッドランナは未認証のソースからは実行しない。
    # フォークからのPRは`is-trusted`が失敗するので、ここも後ろのジョブも動きません。
    if: needs.is-trusted.result == 'success'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 360 # キャッシュが切れている時は時間がかかるため長めに設定。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: ./check.sh
        env:
          CHECK_OUTPUT: ciJobs

  build-nix-on-droid:
    name: build-nix-on-droid
    # ビルドするものはaarch64なので、
    # GitHubホステッドのaarch64のランナでエミュレーション無しにビルドします。
    # セルフホステッドランナはx86_64なので、
    # そちらで動かすとQEMUのユーザモードでのエミュレーションが要ります。
    # セルフホステッドランナを使わないので`is-trusted`の結果は待ちません。
    # そのためフォークからのPRでも動きます。
    # その時はOIDCのトークンが発行されませんが、
    # `Mic92/niks3-action`はキャッシュへの登録を飛ばして取得だけを設定するので、
    # ジョブは落ちません。
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # `ncaq/nix-composite-action`内のniks3-publicとのOIDC認証に使用
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360 # キャッシュが切れている時は時間がかかるため長めに設定。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      # Nix-on-Droidのビルドはimpureモードで行う必要があります
      - run: nix build -L .#nixOnDroidConfigurations.default.activationPackage --impure
      # `install.sh`が呼ぶ本体です。
      # 実機ではソースを展開できずビルドできないので、ここでビルドしてキャッシュから取れるようにします。
      - run: nix build -L --no-link .#dotfiles-install

  renovate-recovery:
    name: renovate-recovery
    # RenovateのPRでチェックが失敗した時に、Claude Codeが原因を調べて代わりのPRを作ります。
    # 復旧のPRはRenovateのPRではないので、そのチェックが失敗してもここは動きません。
    needs:
      - nix-fast-build
      - build-nix-on-droid
    # `failure()`は実行がキャンセルされた時には成立しません。
    if: >-
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # 呼び出し先のワークフローの権限は呼び出し元の権限に制約されるので、ここで明示します。
    permissions:
      actions: read # 失敗したジョブのログの取得
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # niks3-publicとのOIDC認証と、Claude GitHub Appのトークンの取得に使用
      pull-requests: write # 処理済みかどうかの判定と、結果のコメントの投稿
    uses: ./.github/workflows/renovate-recovery.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      run-id: ${{ github.run_id }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
