name: check

on:
  push:
    branches: [master, main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  is-trusted:
    name: is-trusted
    # 信頼できるソースからのトリガーかを判定します。
    # セルフホステッドランナーの利用を制御するために使用します。
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Log trust conditions and decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPO_FULL_NAME: ${{ github.repository }}
          IS_PUSH: ${{ github.event_name == 'push' }}
          IS_MERGE_GROUP: ${{ github.event_name == 'merge_group' }}
          IS_INTERNAL: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          echo "is-trusted: evaluating trust conditions"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.event.pull_request.head.repo.full_name=${PR_HEAD_REPO_FULL_NAME}"
          echo "github.repository=${REPO_FULL_NAME}"
          echo "condition push=${IS_PUSH}"
          echo "condition merge_group=${IS_MERGE_GROUP}"
          echo "condition internal=${IS_INTERNAL}"
          trusted="false"
          if [ "${IS_PUSH}" = "true" ] || \
            [ "${IS_MERGE_GROUP}" = "true" ] || \
            [ "${IS_INTERNAL}" = "true" ]; then
            trusted="true"
          fi
          echo "trusted=${trusted}"

          if [ "${trusted}" = "true" ]; then
            echo "Trusted source confirmed"
            exit 0
          fi

          echo "Untrusted source: self-hosted runner jobs will not run"
          exit 1

  nvd-diff:
    name: nvd-diff
    # baseとPRのseminarのシステムをnvdで比べて、差分をPRのコメントとして投稿します。
    #
    # 他のセルフホステッドランナーのジョブより先に動かします。
    # ここでseminarのシステムをビルドするので、
    # 後ろのジョブはその成果物を使えて、
    # 重い評価とビルドが同時に走る山も崩せます。
    #
    # 差分を出すのはPRの時だけですが、
    # ジョブごと飛ばすと、
    # これを`needs`に持つ後ろのジョブまで全て飛ばされてしまいます。
    # pushやmerge_groupでも後ろのジョブが動くように、
    # ジョブは毎回動かして、
    # 中のステップだけをPRの時に限ります。
    needs: is-trusted
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # `ncaq/nix-composite-action`内のniks3-publicとのOIDC認証に使用
      pull-requests: write # PRコメントのupsert
    # セルフホステッドランナーは未認証のソースからは実行しない。
    # フォークからのPRは`is-trusted`が失敗するので、ここも後ろのジョブも動きません。
    if: needs.is-trusted.result == 'success'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 360 # キャッシュが切れている時は時間がかかるため長めに設定。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          # base refのworktree展開のために全オブジェクトを要求。
          # 履歴の浅さに依存しない安全側に倒しています。
          # そこまで重いリポジトリでもないのでフルに要求しても問題はありません。
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        if: github.event_name == 'pull_request'
      - name: Run nvd-pr-diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#nvd-pr-diff

  nix-fast-build:
    name: nix-fast-build
    needs:
      - is-trusted
      # 重い評価とビルドの山を崩すため、先に`nvd-diff`を終わらせます。
      - nvd-diff
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # `ncaq/nix-composite-action`内のniks3-publicとのOIDC認証に使用
    # セルフホステッドランナーは未認証のソースからは実行しない。
    if: needs.is-trusted.result == 'success'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 360 # キャッシュが切れている時は時間がかかるため長めに設定。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: ./check.sh

  build-home-manager:
    name: build-home-manager
    needs:
      - is-trusted
      # 無駄なビルドを避けるため事前にキャッシュを貯めるために先に`build-nixos`を実行。
      # 普段は並列に実行した方が効率が良いですが、
      # パッケージに大きな変動が起きてビルドが必要になった時は、
      # CPUのスレッド数が足りなくなるため、
      # 先にビルドだけを済ませてキャッシュにビルド結果を貯めておくほうが効率が良いです。
      # 普段はそんなに時間がかからず、
      # 大きな変動が起きた時だけ異様に時間がかかるので、
      # そちらを優先してケアするほうがリソース配分的に合理的です。
      - build-nixos
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # `ncaq/nix-composite-action`内のniks3-publicとのOIDC認証に使用
    # セルフホステッドランナーは未認証のソースからは実行しない。
    if: needs.is-trusted.result == 'success'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 360 # キャッシュが切れている時は時間がかかるため長めに設定。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix build -L .#homeConfigurations.x86_64-linux.activationPackage

  build-nix-on-droid:
    name: build-nix-on-droid
    # ビルドするものはaarch64なので、
    # GitHubホステッドのaarch64のランナーでエミュレーション無しにビルドします。
    # セルフホステッドランナーはx86_64なので、
    # そちらで動かすとQEMUのユーザーモードでのエミュレーションが要ります。
    # セルフホステッドランナーを使わないので`is-trusted`の結果は待ちません。
    # そのためフォークからのPRでも動きます。
    # その時はOIDCのトークンが発行されませんが、
    # `Mic92/niks3-action`はキャッシュへの登録を飛ばして取得だけを設定するので、
    # ジョブは落ちません。
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # `ncaq/nix-composite-action`内のniks3-publicとのOIDC認証に使用
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360 # キャッシュが切れている時は時間がかかるため長めに設定。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      # Nix-on-Droidのビルドはimpureモードで行う必要があります
      - run: nix build -L .#nixOnDroidConfigurations.default.activationPackage --impure

  build-nixos:
    name: build-nixos
    needs:
      - is-trusted
      # `nvd-diff`がビルドしたseminarのシステムを使うため、先に終わらせます。
      - nvd-diff
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # `ncaq/nix-composite-action`内のniks3-publicとのOIDC認証に使用
    # セルフホステッドランナーは未認証のソースからは実行しない。
    if: needs.is-trusted.result == 'success'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 360 # キャッシュが切れている時は時間がかかるため長めに設定。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: nix build
        run: >-
          nix eval --json .#nixosConfigurations --apply builtins.attrNames |
          jq -r '.[] | ".#nixosConfigurations.\(.).config.system.build.toplevel"' |
          xargs nix build -L --keep-going

  renovate-recovery:
    name: renovate-recovery
    # RenovateのPRでチェックが失敗した時に、Claude Codeが原因を調べて代わりのPRを作ります。
    # 復旧のPRはRenovateのPRではないので、そのチェックが失敗してもここは動きません。
    needs:
      - nix-fast-build
      - build-home-manager
      - build-nix-on-droid
      - build-nixos
      - test-nixos-boot
    # `failure()`は実行がキャンセルされた時には成立しません。
    if: >-
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # 呼び出し先のワークフローの権限は呼び出し元の権限に制約されるので、ここで明示します。
    permissions:
      actions: read # 失敗したジョブのログの取得
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # niks3-publicとのOIDC認証と、Claude GitHub Appのトークンの取得に使用
      pull-requests: write # 処理済みかどうかの判定と、結果のコメントの投稿
    uses: ./.github/workflows/renovate-recovery.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      run-id: ${{ github.run_id }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  test-nixos-boot:
    name: test-nixos-boot
    needs:
      - is-trusted
      # 無駄なビルドを避けるため事前にキャッシュを貯めるために先に`build-nixos`を実行。
      - build-nixos
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # `ncaq/nix-composite-action`内のniks3-publicとのOIDC認証に使用
    # セルフホステッドランナーは未認証のソースからは実行しない。
    if: needs.is-trusted.result == 'success'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 360 # キャッシュが切れている時は時間がかかるため長めに設定。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      # `nix build`は1つのプロセスでホストを1つずつ評価しますが、
      # `nix-fast-build`はホストごとに評価のワーカーへ割り振るので評価も並列に進みます。
      # ランナーのVMのPATHにある、メモリに合わせてワーカー数を抑えるラッパーを使います。
      # オプションの意味は`./check.sh`と同じです。
      - name: nix-fast-build
        run: nix-fast-build --flake .#testNixosBoot --option eval-cache false --no-nom
