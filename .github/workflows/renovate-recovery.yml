name: renovate-recovery

# RenovateのPRのCIが失敗した時に、Claude Codeが原因を調べて代わりのPRを作ります。
# Claude Codeへの指示は`pkgs/renovate-recovery/prompt.md`に、
# 起動するかどうかの判定は`pkgs/renovate-recovery/src/decide.ts`に書いてあります。
#
# `check`ワークフローのジョブが失敗した時に`workflow_call`で呼ばれます。
# `workflow_dispatch`は、抑止の条件を無視して手動でやり直すためのものです。

on:
  workflow_call:
    inputs:
      pr-number:
        description: 復旧の対象にするRenovateのPRの番号
        type: number
        required: true
      run-id:
        description: 失敗したワークフローの実行のID
        type: string
        required: false
        default: ""
      force:
        description: 処理済みかどうかの判定を無視して実行する
        type: boolean
        required: false
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude CodeのOAuthトークン
        required: true
  workflow_dispatch:
    inputs:
      pr-number:
        description: 復旧の対象にするRenovateのPRの番号
        type: number
        required: true
      run-id:
        description: 失敗したワークフローの実行のID(空ならClaude Codeが探す)
        type: string
        required: false
        default: ""
      force:
        description: 処理済みかどうかの判定を無視して実行する
        type: boolean
        required: false
        default: true

permissions: {}

# 同じPRに対する復旧が自動と手動で重ならないようにします。
# 動いている復旧は途中で止めず、後から来たものを待たせます。
concurrency:
  group: renovate-recovery-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    # Claude Codeを起動するかどうかを決めます。
    # RenovateはmasterがすすむたびにPRをrebaseするので、CIは同じ原因で何度も失敗します。
    # そのたびにClaude Codeを動かさないよう、ここで安く判定して弾きます。
    # セルフホステッドランナーを占有しないようGitHubのランナーで動かします。
    permissions:
      contents: read # 判定のスクリプトのチェックアウト
      pull-requests: read # PRの情報とコメントの読み取り
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      key: ${{ steps.decide.outputs.key }}
      head-ref: ${{ steps.decide.outputs.head-ref }}
      head-sha: ${{ steps.decide.outputs.head-sha }}
      base-sha: ${{ steps.decide.outputs.base-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: pkgs/renovate-recovery
      - name: Decide whether to run
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          FORCE: ${{ inputs.force }}
          # 同じPRに対して次に動かすまで空ける時間。
          # lock file maintenanceはrebaseのたびに内容が変わるので、
          # 長く壊れている間は1日に1回だけ動くようにします。
          COOLDOWN_HOURS: "20"
        with:
          # github-scriptの中のNode.jsは`.ts`をそのまま読み込めます。
          script: |
            const { gate } = await import(`${process.env.GITHUB_WORKSPACE}/pkgs/renovate-recovery/src/gate.ts`)
            await gate({ github, context, core })

  recover:
    name: recover
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Claude GitHub Appが自分のトークンを管理するので、ここで必要な権限は最小限です。
    permissions:
      actions: read # 失敗したジョブのログの取得
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # niks3-publicとのOIDC認証と、Claude GitHub Appのトークンの取得に使用
      pull-requests: write # 結果のコメントの投稿
    # 失敗の再現と修正の検証にNixのビルドが要りますが、
    # GitHubのランナーではディスクが足りないためセルフホステッドランナーで動かします。
    runs-on: [self-hosted, Linux]
    timeout-minutes: 360 # キャッシュが切れている時は時間がかかるため長めに設定。
    env:
      # Claude Codeが一時ファイルや結果のファイルを書く、作業ツリーの中のディレクトリです。
      # `prompt.md`にも同じ名前を書いているので、変える時は合わせてください。
      RECOVERY_DIR: .renovate-recovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.head-sha }}
          # masterとの比較やブランチの作成のために全オブジェクトを要求。
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Keep a copy of the comment script
        # Claude Codeが作業ツリーを書き換えても、結果の投稿には元のスクリプトを使います。
        #
        # 実行の記録を暗号化する公開鍵も、Claude Codeが動く前に写しを取ります。
        run: |
          set -euo pipefail
          cp -r pkgs/renovate-recovery/src "${RUNNER_TEMP}/renovate-recovery-src"
          cp key/ncaq-public-key.asc "${RUNNER_TEMP}/execution-log-public-key.asc"
      - name: Prepare a work directory for Claude Code
        # Claude Codeが一時ファイルや結果のファイルを書く場所です。
        # `runner.temp`には後のステップが使うスクリプトのコピーや`GITHUB_ENV`のファイルがあるので、
        # Claude Codeには書かせず、作業ツリーの中に専用の場所を作ります。
        # 作業ツリーの中なら相対パスで扱えるので、絶対パスを拒否する権限の規則とも両立します。
        # `.git/info/exclude`に足して、
        # `git status`やflakeのソースやコミットの対象に入らないようにします。
        #
        # `core.symlinks`を切って、checkoutやrestoreがシンボリックリンクをただのファイルとして書くようにします。
        # Claude Codeは`git fetch`と`git checkout`で任意のコミットの中身を作業ツリーに置けます。
        # リンクを置けると、
        # 相対パスで作業ツリーの外を読んだり、
        # 結果のファイルを`/proc/self/environ`などへのリンクにしたりできてしまいます。
        # `.git/config`はClaude Codeの権限の規則で書き換えを拒否しています。
        run: |
          set -euo pipefail
          mkdir -p "${RECOVERY_DIR}"
          echo "/${RECOVERY_DIR}/" >>.git/info/exclude
          git config --local core.symlinks false
      - name: Fetch failed job logs
        # 失敗したジョブのログをClaude Codeが読める場所へ保存します。
        # Claude Codeに任意のジョブのログを取得するAPIを許可しなくて済むよう、ここで取得します。
        # ログは補助なので、ここが失敗してもClaude Codeは起動します。
        # 失敗したまま止まると、Claude Codeが動かないのに処理済みとして記録されてしまいます。
        # スクリプトも失敗を警告に留めますが、取りこぼした例外にも備えます。
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ inputs.run-id }}
          LOG_DIR: ${{ github.workspace }}/${{ env.RECOVERY_DIR }}/logs
        with:
          script: |
            const { fetchFailedJobLogs } = await import(`${process.env.RUNNER_TEMP}/renovate-recovery-src/fetch-failed-job-logs.ts`)
            await fetchFailedJobLogs({ github, context, core })
      - name: Build Claude Code and Bun
        id: executables
        env:
          # RenovateのPRの`flake.lock`は壊れている可能性があるので、baseのものを使います。
          FLAKE: github:${{ github.repository }}/${{ needs.gate.outputs.base-sha }}
        run: |
          set -euo pipefail
          claude=$(nix build --no-link --print-out-paths "${FLAKE}#claude-code")
          bun=$(nix build --no-link --print-out-paths "${FLAKE}#bun")
          # プラグインやプロンプトなど、普段の設定から同期したものです。
          # 中身は`pkgs/renovate-recovery/claude-config.nix`に書いてあります。
          config=$(nix build --no-link --print-out-paths "${FLAKE}#renovate-recovery-claude-config")
          args=(
            --settings "${config}/settings.json"
            --append-system-prompt-file "${config}/append-system-prompt.md"
          )
          # プラグインが無い時にglobがそのまま引数に渡らないようにします。
          shopt -s nullglob
          plugins=("${config}"/plugins/*)
          if [ "${#plugins[@]}" -eq 0 ]; then
            echo "::error::${config}/plugins にプラグインがありません"
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            args+=(--plugin-dir "${plugin}")
          done
          # `commit`プラグインの`run-commit-msg-hook`が、
          # 普段と同じcommitlintの検査をコミットメッセージにかけられるようにします。
          # 作業ツリーではなく`.git/config`に書くので、コミットの対象にはなりません。
          git config --local core.hooksPath "${config}/git-hooks"
          {
            echo "claude=${claude}/bin/claude"
            echo "bun=${bun}/bin/bun"
            echo "claude-config-args=${args[*]}"
          } >>"$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        id: claude
        env:
          # `use_commit_signing`のコミット先のブランチです。
          # 未指定だと`GITHUB_HEAD_REF`、つまりRenovateのブランチへコミットしてしまいます。
          CLAUDE_BRANCH: renovate-recovery/${{ inputs.pr-number }}
          # Claude Codeが実行するコマンドの環境変数から、Anthropicの認証情報を取り除きます。
          # GitHub Actionsの中では既定で有効ですが、既定が変わっても外れないよう明示します。
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.executables.outputs.claude }}
          path_to_bun_executable: ${{ steps.executables.outputs.bun }}
          # `check`から呼ばれた時のactorはRenovateです。
          allowed_bots: renovate
          # 失敗したジョブのログを読むために必要です。
          additional_permissions: |
            actions: read
          display_report: "true"
          # masterのブランチ保護は署名付きのコミットを要求します。
          # コミットをGitHubのAPI経由で作り、GitHubに署名させます。
          use_commit_signing: "true"
          # 復旧のブランチが無い時に、RenovateのPRのheadから切るためのブランチです。
          base_branch: ${{ needs.gate.outputs.head-ref }}
          # 許可するツールとコマンドの大半は、
          # `pkgs/renovate-recovery/claude-config.nix`の`permissions`に書いてあります。
          # ここでは実行ごとに変わるもの、
          # つまり以前の復旧で作ったブランチの削除だけを許可します。
          #
          # スキルの`allowed-tools`は範囲の無い`Edit`を許可することがあるので、
          # `runner.temp`への書き込みはここで明示的に拒否します。
          #
          # 規則は空白や`*`を含むので、
          # `claude_args`を引数に分ける時に1つの引数のまま渡るよう単一引用符で囲みます。
          claude_args: >-
            --model opus
            --allowedTools
            'Bash(gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/renovate-recovery/${{ inputs.pr-number }})'
            --disallowedTools
            'Edit(/${{ runner.temp }}/**)'
            ${{ steps.executables.outputs.claude-config-args }}
          prompt: |
            `pkgs/renovate-recovery/prompt.md`を読んで、その手順に従ってください。

            - リポジトリ: ${{ github.repository }}
            - RenovateのPRの番号: ${{ inputs.pr-number }}
            - 失敗したワークフローの実行のID: ${{ inputs.run-id || '(未指定)' }}
            - 結果を書くファイル: ${{ env.RECOVERY_DIR }}/result.md
      - name: Report execution summary
        # 復旧がうまく動かなかった時に原因を追えるよう、Claude Codeの実行の記録の要約をログに出します。
        # 記録の全文はツールの結果を含むので、公開のログには出せません。
        # 読み込まれたプラグインやMCPサーバーの状態、呼ばれたツールの名前、
        # 権限で拒否された呼び出しのような、中身を含まない構造だけを出します。
        # 何を出すかは`pkgs/renovate-recovery/src/execution-summary.ts`に書いてあります。
        # 調査のための補助なので、失敗しても結果の投稿は続けます。
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        with:
          script: |
            const { reportExecution } = await import(`${process.env.RUNNER_TEMP}/renovate-recovery-src/report-execution.ts`)
            await reportExecution({ github, context, core })
      - name: Encrypt execution log
        # 要約で足りない時のために、実行の記録の全文を暗号化して残します。
        # 公開のリポジトリのアーティファクトはGitHubにログインしていれば誰でも取得できるので、
        # 秘密鍵を持つ人だけが読めるよう、リポジトリの管理者のGPGの公開鍵で暗号化します。
        #
        # 公開鍵の写しはClaude Codeが動く前に取っていて、
        # 宛先は主鍵のフィンガープリントで指定します。
        # 鍵のファイルが別の鍵に差し替えられていたら、宛先が見つからずに失敗します。
        #
        # 読む時は、アーティファクトを取得して`gpg --decrypt`します。
        id: encrypt
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        continue-on-error: true
        env:
          FLAKE: github:${{ github.repository }}/${{ needs.gate.outputs.base-sha }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          # `.sops.yaml`と同じ、ncaqのGPGの主鍵のフィンガープリントです。
          RECIPIENT: 7DDE3BC405DC58D94BF661D342248C7D0FB73D57
        run: |
          set -euo pipefail
          # gnupgは出力が複数あるので、実行ファイルのある`out`だけを指定します。
          gnupg=$(nix build --no-link --print-out-paths "${FLAKE}#gnupg^out")
          GNUPGHOME=$(mktemp -d -p "${RUNNER_TEMP}")
          export GNUPGHOME
          "${gnupg}/bin/gpg" --batch --import "${RUNNER_TEMP}/execution-log-public-key.asc"
          # 取り込んだばかりの鍵には信用の設定が無いので、フィンガープリントでの指定を信用します。
          "${gnupg}/bin/gpg" --batch --trust-model always \
            --recipient "${RECIPIENT}" \
            --output "${RUNNER_TEMP}/claude-execution-output.json.gpg" \
            --encrypt "${EXECUTION_FILE}"
          echo "file=${RUNNER_TEMP}/claude-execution-output.json.gpg" >>"$GITHUB_OUTPUT"
      - name: Upload encrypted execution log
        if: ${{ !cancelled() && steps.encrypt.outputs.file != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output-${{ inputs.pr-number }}
          path: ${{ steps.encrypt.outputs.file }}
          if-no-files-found: error
          # 調査が済めば要らないので、長くは残しません。
          retention-days: 7
      - name: Post result comment
        # rebaseで実行ごと打ち切られた時は記録を残さず、新しい内容での失敗に任せます。
        # それ以外は失敗でも記録して、同じ内容で何度も動かないようにします。
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          KEY: ${{ needs.gate.outputs.key }}
          # 投稿のスクリプトは、このファイルとその親のディレクトリがリンクではないことを確かめてから読みます。
          # シンボリックリンクで秘密を読ませる細工を投稿しないためです。
          RESULT_FILE: ${{ github.workspace }}/${{ env.RECOVERY_DIR }}/result.md
        with:
          script: |
            const { postComment } = await import(`${process.env.RUNNER_TEMP}/renovate-recovery-src/post-comment.ts`)
            await postComment({ github, context, core })
