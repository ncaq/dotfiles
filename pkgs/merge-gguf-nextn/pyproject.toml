[project]
name = "merge-gguf-nextn"
version = "0.1.0"
description = "GGUFの本体へ、別ファイルで配られたMTPのNextN層を足すコマンド"
requires-python = ">=3.12"
dependencies = ["gguf", "numpy"]

[project.scripts]
merge-gguf-nextn = "merge_gguf_nextn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merge_gguf_nextn"]
