# ruffのlintルール設定。
#
# treefmtの`ruff-check`とエディタと手元の`ruff check`が同じルールを見るように、
# リポジトリのルートへ置く。
# `pkgs/safetensors-fp16/pyproject.toml`には`[tool.ruff]`が無いので、
# ruffは設定を上へ探しに来てここへ辿り着く。

# 対象とするPythonのバージョン。
#
# ruffは設定を提供したファイルを基準に`requires-python`を探すので、
# 設定がここにある限り`pkgs/safetensors-fp16/pyproject.toml`の宣言は使われず、
# 書かなければruffの既定のバージョンで判定される。
# 新しい構文への置き換えを勧める`UP`が本来の指摘を出さなくなるため明示する。
#
# ComfyUIのPython環境も`requires-python`もどちらも3.12なので、
# 型検査と同じ下限で揃う。
target-version = "py312"

[lint]
# 既定のE4/E7/E9/Fに加えて、実行しなくても分かる誤りを拾うルールを足す。
# 選んだのは、現状のコードで指摘が出ないか、
# 出ても意図を書けば済む程度に収まるものだけ。
extend-select = [
  "A",     # 組み込み名の隠蔽
  "ASYNC", # asyncの誤用
  "B",     # bugbear、可変デフォルト引数やループ変数の捕捉など
  "C4",    # 内包表記で書けるもの
  "EXE",   # shebangと実行ビットの不一致
  "FURB",  # 古い書き方の置き換え
  "G",     # loggingへ渡す文字列の組み立て方
  "INT",   # gettextの誤用
  "LOG",   # loggingの誤用
  "PERF",  # 明らかに無駄なループ
  "PIE",   # 冗長な記述
  "RET",   # returnの流れ
  "S",     # bandit、資格情報の直書きや脆弱なハッシュやシェル経由の起動
  "SIM",   # 単純化できる分岐や文
  "SLOT",  # __slots__の付け忘れ
  "TID",   # importの書き方
  "UP",    # 新しい構文への更新
]

ignore = [
  # `assert`の使用そのものを警告する。
  # `python -O`で消えることを問題にしているが、
  # 消えて困る検証を`assert`で書かないのは前提として共有できている。
  # pytestは`assert`で書くのが普通のスタイルでもあり、
  # テストの外でも不変条件を短く置く用途で使いたい。
  "S101",
  # 絶対パスでない実行ファイル名を警告する。
  # 呼び出し先はNixが用意した環境のPATHから解決させたい。
  "S607",
  # `while 0 < remaining:`のような昇順の比較をyoda conditionとして書き換えさせる。
  # 数直線と同じ並びで読める方を意図的に選んでいるので従わない。
  "SIM300",
]

# `S603`はsubprocessの呼び出しそのものを警告する。
# ffmpegやoxipngやSeedVR2 CLIの起動はこのリポジトリの目的そのものなので、
# 実際に外部コマンドを起動しているファイルでだけ許可する。
# 全体で落とすと、新しくプロセスを起動するコードを書いた時に何も言われなくなる。
#
# 共有モジュールは使う側のノードディレクトリへのsymlinkとしても現れるので、
# ディレクトリを固定せずファイル名で拾う。
[lint.per-file-ignores]
"**/optimize_png.py" = ["S603"]
"**/share_encode.py" = ["S603"]
"**/anime-video-quick/__init__.py" = ["S603"]
"**/seedvr2-streaming/__init__.py" = ["S603"]

# 以下は検討した上で採らなかったもの。
#
# PL: 引数や分岐の数の上限を課すが、
#     ComfyUIのノードは入力の数だけ引数が並ぶ作りなので21引数などが正常。
# RUF001-003: 日本語のコメントと中国語のnegative promptを、
#             紛らわしいUnicode文字として大量に報告する。
# N: `INPUT_TYPES`や`IS_CHANGED`はComfyUIが要求する名前で、
#    ハイフン入りのディレクトリ名もComfyUIの慣習。
# E501: 行長は`.editorconfig`の100文字をeditorconfig-checkerが見ている。
