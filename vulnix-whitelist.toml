# vulnixのホワイトリスト。
#
# 書式は https://github.com/nix-community/vulnix#whitelist を参照。
# セクション名が `["pname"]` なら全バージョン、`["pname-version"]` ならそのバージョンだけに適用される。
# `cve` を書いたルールはそのCVEだけを隠し、同じパッケージの他のCVEは報告され続ける。
# `cve` を書かないルールはそのパッケージの全CVEを隠す。
#
# ルールの書き方は、誤検知の原因ごとに以下のように決める。
#
# 名前衝突で、そのNixパッケージ自身がその名前でNVDにCVEを登録されることがまず無いもの。
# 主にHackageのライブラリ。衝突はバージョンを上げても再発するので、
# `["pname"]` で全バージョンを `cve` 無しで隠す。
# ただしpnameが別の本物のパッケージ(glib, zlibなど)と同じ場合は、
# 本物を巻き込まないよう `["pname-version"]` でバージョンを限定する。
#
# 名前衝突で、そのNixパッケージ自身が本物でありCVEを持ちうるもの。
# gitとJenkinsのGit Pluginのような関係。本物のCVEを隠さないよう、
# `["pname"]` に衝突相手のCVEを `cve` で列挙する。
#
# 同じ製品だが、別プラットフォームや別ディストリビューション固有のCVE。
# 上と同様に `["pname"]` に `cve` を列挙する。
#
# 派生物名からのバージョン切り出しが壊れていて、実在しないバージョンとして照合されるもの。
# その壊れた名前そのものを `["pname-version"]` で `cve` 無しで隠す。
#
# バージョン比較の誤りで、修正済みバージョンが報告されるもの。
# `["pname-version"]` にそのCVEを `cve` で列挙する。
# バージョンが上がれば自然に外れる。

# 名前衝突: Nixパッケージ自身がCVEを持つことがまず無いもの。
# xmonadやhaskell-language-serverの実行時閉包に入るHackageのライブラリ。

["Diff"]
comment = "Haskell Diff。NVDはDrupalのDiffモジュール"

["async"]
comment = "Haskell async。NVDはnpmのasync"

["focus"]
comment = "Haskell focus。NVDはFirefox Focus"

["network"]
comment = "Haskell network。NVDはFidelis Network"

["regex"]
comment = "Haskell regex。NVDはRustのregex crate"

["safe"]
comment = "Haskell safe。NVDはF-Secure SAFE Browser"

["tar"]
comment = "Haskell tar。NVDはGNU tarとnode-tar。GNU tarのpnameはgnutar"

["yaml"]
comment = "Haskell yaml。NVDはGoのyaml"

# 同上だが、pnameが本物のパッケージと同じなのでバージョンで限定する。

["glib-0.13.12.0"]
comment = "Haskell glib (gtk2hs)。NVDはGNOME GLib"

["zlib-0.7.1.1"]
comment = "Haskell zlib。NVDはzlib本体やRubyのzlib"

["dbus-1.4.2"]
comment = "Haskell dbus。NVDはD-Bus本体"

["opentelemetry-0.8.0"]
comment = "Haskell opentelemetry (hls-plugin-apiが依存)。NVDはGo/.NET/C++/JS/Jenkinsのもの"

# 名前衝突: Nixパッケージ自身が本物でCVEを持ちうるもの。衝突相手のCVEだけを列挙する。

