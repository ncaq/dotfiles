# 本物の脆弱性で、nixpkgsで修正が進んでいてチャンネルに降りてくるのを待つもの。
# `["pname-version"]` に待っているCVEを `cve` で列挙し、
# 修正のPRを `issue_url` に、おおむね1か月後の日付を `until` に書く。
# 修正版が降りてくればバージョンが変わって外れ、
# 修正が滞っていれば期限切れで再び報告される。
# `["pname-version"]` が誤検知の判定で既に使われている時は、
# 同じセクションに書くと `until` で誤検知の判定まで外れてしまうので、
# `["pname"]`、それも使われていれば `["*"]` に書く。
# 他のバージョンや他のパッケージの、修正の動きが無い同じCVEを巻き込む時は書かない。
# 書き方の例は以下の通り。
#
#   ["foo-1.2.3"]
#   cve = ["CVE-2026-00000"]
#   issue_url = "https://github.com/NixOS/nixpkgs/pull/000000"
#   until = "2026-12-06"
#   comment = "1.2.4への更新PR。staging-26.05へのバックポート待ち"

# gimpは ["gimp"] も ["gimp-3.0.8"] も誤検知の判定で使っているので、
