# vulnixのホワイトリスト。
#
# ここに書くのは誤検知と修正済みの判定、そして上流の修正を待っている本物の脆弱性だけ。
# 本物の脆弱性に対処するかしないかの方針は docs/vulnerability-policy.md を参照。
# 上流の修正待ち以外の理由で対処しないと決めた本物の脆弱性はここには書かない。
#
# 実行例。実行時閉包だけを見るために -C を付ける。
# 既定の --requisites はビルド時依存まで含む派生物の閉包を見るので、
# ブートストラップ用のgccやHaskellのビルド依存まで報告されてしまう。
#
#   vulnix -C /run/current-system -w vulnix-whitelist.toml
#
# 隠したものも修正のPRのURLと一緒に見たい時は -s (--show-whitelisted) を付ける。
#
#   vulnix -C /run/current-system -w vulnix-whitelist.toml -s
#
# vulnixはnix-community/vulnixのmasterを使う。
# 1.12.5以前は __structuredAttrs を使う派生物の patches を読めず、
# パッチ済みのCVEをそのまま報告してしまう。
#
# 書式は https://github.com/nix-community/vulnix#whitelist を参照。
# セクション名が `["pname"]` なら全バージョン、`["pname-version"]` ならそのバージョンだけに適用される。
# `cve` を書いたルールはそのCVEだけを隠し、同じパッケージの他のCVEは報告され続ける。
# `cve` を書かないルールはそのパッケージの全CVEを隠す。
#
# ルールは隠す理由ごとにまとめ、
# 書き方はそれぞれのまとまりの先頭のコメントに書く。

# 名前衝突で、そのNixパッケージ自身がその名前でNVDにCVEを登録されることがまず無いもの。
# 主にxmonadやhaskell-language-serverの実行時閉包に入るHackageのライブラリ。
# 衝突はバージョンを上げても再発するので、
# `["pname"]` で全バージョンを `cve` 無しで隠す。

